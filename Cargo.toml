[package]
name = "veto"
version = "0.1.0"
edition = "2021"
authors = ["datekt"]
description = "Veto: A lightning-fast CLI utility built in Rust that scans your code and blocks builds only on critical, fatal bugs by generating an errors.json report."
license = "MIT"
repository = "https://github.com/datekt/veto"
readme = "README.md"
keywords = ["linter", "cli", "json", "rust", "validation"]
categories = ["development-tools::development-practices"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"